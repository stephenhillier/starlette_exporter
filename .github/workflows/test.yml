name: Python unit tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    - name: Lint with flake8
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  mypy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    - name: Type checking with mypy
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt mypy
        python -m mypy starlette_exporter

  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
    - name: Test with pytest
      run: |
        python -m pytest

  fastapi-routing:
    strategy:
      fail-fast: false
      matrix:
        fastapi-version: ["0.136.0", "0.137.0", "0.137.2"]

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    - name: Install FastAPI ${{ matrix.fastapi-version }}
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e . "fastapi==${{ matrix.fastapi-version }}" "httpx>=0.23,<1" "pytest>=9,<10"
    - name: Test FastAPI routing compatibility
      run: python -m pytest tests/test_fastapi_routing.py
